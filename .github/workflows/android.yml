name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Cheap, dependency-free, and catches the documentation rotting faster
      # than anything else: a link to a page that was renamed or removed.
      - name: Documentation links
        run: python3 scripts/check-docs-links.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The parity fixtures are committed, so the reference engine is not needed
      # to run the suite — only to regenerate them (see tools/ts-reference).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      # A stale notices file is a stale in-app licence screen. `--check`
      # compares the committed file against the real resolved classpath and
      # fails on a module that is missing from it or has left it.
      #
      # It deliberately does not regenerate. Regeneration reads POMs and
      # artifacts out of the Gradle module cache, and a runner's cache holds
      # only what its build needed — which made a full regeneration here report
      # every dependency as unlicensed rather than reporting the real problem.
      - name: Third-party notices cover the release classpath
        run: python3 scripts/third-party-notices.py --check

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The keystore cannot live in a secret as a file, so it travels as
      # base64 and is written to the runner for the length of the job. Nothing
      # is echoed, and the file is deleted in `Remove keystore` below whatever
      # happens. See docs/RELEASE-SIGNING.md.
      - name: Decode release keystore
        env:
          EARTH_KEYSTORE_BASE64: ${{ secrets.EARTH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$EARTH_KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; the release build will be unsigned."
            exit 0
          fi
          printf '%s' "$EARTH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/earth-release.jks"
          echo "EARTH_KEYSTORE=$RUNNER_TEMP/earth-release.jks" >> "$GITHUB_ENV"

      # Unsigned unless the four signing secrets are configured; the build
      # deliberately still produces artifacts either way, so a pull request
      # from a fork is not blocked.
      - name: Release APK and bundle
        env:
          EARTH_KEYSTORE_PASSWORD: ${{ secrets.EARTH_KEYSTORE_PASSWORD }}
          EARTH_KEY_ALIAS: ${{ secrets.EARTH_KEY_ALIAS }}
          EARTH_KEY_PASSWORD: ${{ secrets.EARTH_KEY_PASSWORD }}
        run: ./gradlew packageReleaseArtifacts --stacktrace

      # Before the upload step, so a keystore can never be globbed into an
      # artifact — and outside the release directory for the same reason.
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/earth-release.jks"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-build-outputs
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            release/EARTH-*.apk
            release/EARTH-*.aab
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
