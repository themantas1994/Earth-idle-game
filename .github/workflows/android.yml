name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The parity fixtures are committed, so the reference engine is not needed
      # to run the suite — only to regenerate them (see tools/ts-reference).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug lintRelease --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned unless a keystore is configured in repository secrets; the
      # build deliberately still produces an artifact either way, so a fork
      # without secrets is not blocked.
      - name: Release bundle
        env:
          EARTH_KEYSTORE_PASSWORD: ${{ secrets.EARTH_KEYSTORE_PASSWORD }}
          EARTH_KEY_ALIAS: ${{ secrets.EARTH_KEY_ALIAS }}
          EARTH_KEY_PASSWORD: ${{ secrets.EARTH_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-build-outputs
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-*.html
            app/build/reports/tests/**
