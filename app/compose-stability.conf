// Classes the Compose compiler must treat as stable.
//
// Every type listed here is deeply immutable — final class, `val`-only, and every
// nested container is itself immutable or a defensive copy — but the compiler
// cannot see that from the outside: `GameState` holds `Map`/`List` (interfaces,
// so unknowable), and the amount containers hold a private array.
//
// The alternative would be annotating them with `@Immutable`, which means adding
// `androidx.compose.runtime` as a dependency of `domain/`. That package has no
// Android or Compose dependency at all, which is what lets the whole simulation
// run as plain JVM tests, and is asserted by the layering rules in
// docs/wiki/Architecture.md. Declaring stability from the outside keeps that
// intact.
//
// Without this the entire screen recomposes on every 250 ms tick even where
// nothing a composable reads has changed, because an unstable parameter type
// makes a composable unskippable regardless of its value.
com.earthgame.idle.domain.engine.GameDecimal
com.earthgame.idle.domain.model.GasAmounts
com.earthgame.idle.domain.model.GasDoubles
com.earthgame.idle.domain.model.ResourceAmounts
com.earthgame.idle.domain.model.GameState
